<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2048 | God's Plan Games</title>
<meta name="theme-color" content="#0b0a0a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b0a0a'/%3E%3Cpath%20d='M28%2010h8v16h16v8H36v22h-8V34H12v-8h16z'%20fill='%23ef5058'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/games.css">
<style>
  .grid { --n: 4; --gap: .55rem; position: relative; width: min(26rem, calc(100vw - 3.5rem)); aspect-ratio: 1; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: var(--gap); }
  .cell { background: var(--gp-bg-3); border-radius: var(--gp-radius-md); }
  .tiles { position: absolute; inset: 0; }
  .tile { position: absolute; display: grid; place-items: center; border-radius: var(--gp-radius-md); font-family: var(--gp-font-display); font-weight: 800; letter-spacing: -.02em; transition: transform .11s ease-out; }
  .tile.new { animation: g-pop .18s ease-out; }
  .tile.merged { animation: g-pop .18s ease-out; }
</style>
</head>
<body>
<header class="g-bar">
  <a class="g-back" href="index.html">← Juegos</a>
  <h1 class="g-title">20<b>48</b></h1>
  <div class="g-bar__end"><button class="btn btn--sm" id="undo" title="Deshacer (Z)">Deshacer</button><button class="btn btn--sm btn--primary" id="new">Nuevo</button></div>
</header>
<main class="g-main">
  <div class="g-stats">
    <div class="g-stat"><span>puntos</span><strong id="score">0</strong></div>
    <div class="g-stat"><span>récord</span><strong id="best">0</strong></div>
  </div>
  <div class="g-board"><div class="grid" id="grid"><div class="tiles" id="tiles"></div></div></div>
  <p class="g-help">Usa las flechas o desliza. Junta números iguales hasta llegar a 2048.</p>
</main>
<script src="assets/games.js"></script>
<script>
(function () {
  var N = 4, grid, score, prev, won, keepGoing, idSeq = 0;
  var gridEl = document.getElementById('grid'), tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  for (var i = 0; i < N * N; i++) { var c = document.createElement('div'); c.className = 'cell'; gridEl.insertBefore(c, tilesEl); }

  var COLORS = { 2: ['#2a2222', '#f4efee'], 4: ['#352929', '#f4efee'], 8: ['#5c1a1a', '#fff'], 16: ['#7a1414', '#fff'], 32: ['#8a0303', '#fff'], 64: ['#a3080c', '#fff'],
    128: ['#c2343a', '#fff'], 256: ['#d9454c', '#fff'], 512: ['#ef5058', '#fff'], 1024: ['#ff8a8f', '#1a0b0b'], 2048: ['#ffd1d3', '#1a0b0b'] };

  function empty() { var g = []; for (var r = 0; r < N; r++) { g.push([]); for (var c = 0; c < N; c++) g[r].push(null); } return g; }
  function addRandom() {
    var free = []; for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) free.push([r, c]);
    if (!free.length) return; var p = free[Math.floor(Math.random() * free.length)];
    grid[p[0]][p[1]] = { v: Math.random() < 0.9 ? 2 : 4, id: ++idSeq, isNew: true };
  }
  function clone(g) { return g.map(function (row) { return row.map(function (t) { return t ? { v: t.v, id: t.id } : null; }); }); }
  function start() { grid = empty(); score = 0; prev = null; won = false; keepGoing = false; addRandom(); addRandom(); render(); GP.played('2048'); }

  function render() {
    var size = gridEl.clientWidth, gap = parseFloat(getComputedStyle(gridEl).getPropertyValue('--gap')) * 16 || 8.8;
    var cell = (size - gap * (N - 1)) / N, seen = {};
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var t = grid[r][c]; if (!t) continue; seen[t.id] = 1;
      var el = tilesEl.querySelector('[data-id="' + t.id + '"]');
      if (!el) { el = document.createElement('div'); el.className = 'tile'; el.dataset.id = t.id; tilesEl.appendChild(el); }
      var col = COLORS[t.v] || ['#fff', '#1a0b0b'];
      el.style.width = el.style.height = cell + 'px';
      el.style.transform = 'translate(' + (c * (cell + gap)) + 'px,' + (r * (cell + gap)) + 'px)';
      el.style.background = col[0]; el.style.color = col[1];
      el.style.fontSize = (t.v < 100 ? cell * .42 : t.v < 1000 ? cell * .34 : cell * .27) + 'px';
      el.textContent = t.v;
      el.classList.toggle('new', !!t.isNew); el.classList.toggle('merged', !!t.merged);
      delete t.isNew; delete t.merged;
    }
    tilesEl.querySelectorAll('.tile').forEach(function (el) { if (!seen[el.dataset.id]) el.remove(); });
    scoreEl.textContent = score;
    GP.best('2048', score, true); bestEl.textContent = GP.best('2048') || 0;
  }

  function move(dir) {
    if (document.getElementById('g-modal') && document.getElementById('g-modal').classList.contains('is-open')) return;
    var before = clone(grid), beforeScore = score, moved = false;
    var vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
    var rows = [], cols = []; for (var i = 0; i < N; i++) { rows.push(i); cols.push(i); }
    if (vec[0] === 1) rows.reverse(); if (vec[1] === 1) cols.reverse();
    var mergedIds = {};
    rows.forEach(function (r) { cols.forEach(function (c) {
      var t = grid[r][c]; if (!t) return;
      var nr = r, nc = c;
      while (true) {
        var tr = nr + vec[0], tc = nc + vec[1];
        if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
        var o = grid[tr][tc];
        if (!o) { nr = tr; nc = tc; continue; }
        if (o.v === t.v && !mergedIds[o.id]) {
          grid[r][c] = null; o.v *= 2; o.merged = true; mergedIds[o.id] = 1; score += o.v; moved = true;
          if (o.v === 2048 && !won) won = true;
          return;
        }
        break;
      }
      if (nr !== r || nc !== c) { grid[nr][nc] = t; grid[r][c] = null; moved = true; }
    }); });
    if (!moved) return;
    prev = { grid: before, score: beforeScore };
    addRandom(); render();
    if (won && !keepGoing) { keepGoing = true; setTimeout(function () { GP.modal({ title: '¡Llegaste a 2048!', text: 'Puntos: ' + score + '. Puedes seguir jugando.', buttons: [{ label: 'Seguir', primary: true }, { label: 'Nuevo juego', onClick: start }] }); }, 250); return; }
    if (!canMove()) setTimeout(function () { GP.modal({ title: 'Sin movimientos', text: 'Hiciste ' + score + ' puntos.', buttons: [{ label: 'Jugar otra vez', primary: true, onClick: start }] }); }, 300);
  }
  function canMove() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      if (!grid[r][c]) return true;
      if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === grid[r][c].v) return true;
      if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === grid[r][c].v) return true;
    }
    return false;
  }
  function undo() { if (!prev) return; grid = prev.grid; score = prev.score; prev = null; tilesEl.innerHTML = ''; render(); }

  document.addEventListener('keydown', function (e) {
    var k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' }[e.key];
    if (k) { e.preventDefault(); move(k); } else if (e.key === 'z' || e.key === 'Z') undo();
  });
  GP.swipe(gridEl, move);
  document.getElementById('new').onclick = start;
  document.getElementById('undo').onclick = undo;
  window.addEventListener('resize', function () { tilesEl.querySelectorAll('.tile').forEach(function (el) { el.style.transition = 'none'; }); render(); requestAnimationFrame(function () { tilesEl.querySelectorAll('.tile').forEach(function (el) { el.style.transition = ''; }); }); });
  start();
})();
</script>
</body>
</html>
