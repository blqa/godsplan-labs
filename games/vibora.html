<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Víbora | God's Plan Games</title>
<meta name="theme-color" content="#0b0a0a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b0a0a'/%3E%3Cpath%20d='M28%2010h8v16h16v8H36v22h-8V34H12v-8h16z'%20fill='%23ef5058'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/games.css">
<style>
  canvas { display: block; width: min(28rem, calc(100vw - 3.5rem)); height: auto; aspect-ratio: 1; border-radius: var(--gp-radius-md); background: var(--gp-bg-1); }
  .pad { display: grid; grid-template-columns: repeat(3, 3.5rem); grid-template-rows: repeat(2, 3.5rem); gap: .4rem; }
  .pad .btn { min-height: 3.5rem; font-size: 1.25rem; }
  .pad [data-d="up"] { grid-column: 2; } .pad [data-d="left"] { grid-column: 1; grid-row: 2; } .pad [data-d="down"] { grid-column: 2; grid-row: 2; } .pad [data-d="right"] { grid-column: 3; grid-row: 2; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
<header class="g-bar">
  <a class="g-back" href="index.html">← Juegos</a>
  <h1 class="g-title">Ví<b>bora</b></h1>
  <div class="g-bar__end">
    <button class="btn btn--sm" data-speed="150">Lenta</button>
    <button class="btn btn--sm" data-speed="105">Normal</button>
    <button class="btn btn--sm" data-speed="70">Rápida</button>
  </div>
</header>
<main class="g-main">
  <div class="g-stats">
    <div class="g-stat"><span>puntos</span><strong id="score">0</strong></div>
    <div class="g-stat"><span>récord</span><strong id="best">0</strong></div>
  </div>
  <div class="g-board"><canvas id="c" width="560" height="560"></canvas></div>
  <div class="pad" aria-label="Controles">
    <button class="btn" data-d="up" aria-label="Arriba">↑</button><button class="btn" data-d="left" aria-label="Izquierda">←</button>
    <button class="btn" data-d="down" aria-label="Abajo">↓</button><button class="btn" data-d="right" aria-label="Derecha">→</button>
  </div>
  <p class="g-help">Flechas o WASD para moverte, espacio para pausar. En el celular desliza sobre el tablero.</p>
</main>
<script src="assets/games.js"></script>
<script>
(function () {
  var N = 20, cv = document.getElementById('c'), ctx = cv.getContext('2d'), S = cv.width / N;
  var snake, dir, queue, food, score, speed = GP.get('vibora_speed') || 105, timer, running, paused;
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');

  function setSpeed(v) { speed = v; GP.set('vibora_speed', v); document.querySelectorAll('[data-speed]').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.speed === v); }); if (running) { clearInterval(timer); timer = setInterval(tick, speed); } }
  function place() { var f; do { f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (snake.some(function (s) { return s.x === f.x && s.y === f.y; })); food = f; }
  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }]; dir = { x: 1, y: 0 }; queue = []; score = 0; paused = false;
    place(); scoreEl.textContent = 0; bestEl.textContent = GP.best('vibora') || 0; running = false; clearInterval(timer); draw();
    message('Presiona una flecha para empezar');
  }
  function begin() { if (running) return; running = true; GP.played('vibora'); timer = setInterval(tick, speed); }
  function turn(d) {
    var v = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[d];
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (v.x === -last.x && v.y === -last.y) return; if (v.x === last.x && v.y === last.y) { begin(); return; }
    if (queue.length < 3) queue.push(v); begin();
  }
  function tick() {
    if (paused) return;
    if (queue.length) dir = queue.shift();
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var hitsSelf = snake.some(function (s, i) { return i < snake.length - 1 && s.x === h.x && s.y === h.y; });
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || hitsSelf) return over();
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) { score += 10; scoreEl.textContent = score; if (snake.length >= N * N) return over(true); place(); }
    else snake.pop();
    draw();
  }
  function over(win) {
    clearInterval(timer); running = false;
    var record = GP.best('vibora', score, true); bestEl.textContent = GP.best('vibora') || 0;
    GP.modal({ title: win ? '¡Llenaste el tablero!' : 'Chocaste', text: score + ' puntos' + (record && score ? ' · ¡nuevo récord!' : ''), buttons: [{ label: 'Jugar otra vez', primary: true, onClick: reset }] });
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill(); }
  function draw() {
    ctx.fillStyle = '#110f0f'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(255,236,234,0.035)';
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) if ((x + y) % 2) ctx.fillRect(x * S, y * S, S, S);
    ctx.fillStyle = '#3ecf8e'; ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S * .32, 0, Math.PI * 2); ctx.fill();
    snake.forEach(function (s, i) { ctx.fillStyle = i === 0 ? '#ef5058' : (i % 2 ? '#a3080c' : '#8a0303'); rr(s.x * S + 1.5, s.y * S + 1.5, S - 3, S - 3, 6); });
    var h = snake[0]; ctx.fillStyle = '#fff';
    var ex = dir.y !== 0 ? [.3, .7] : [.5 + dir.x * .2, .5 + dir.x * .2], ey = dir.x !== 0 ? [.3, .7] : [.5 + dir.y * .2, .5 + dir.y * .2];
    for (var k = 0; k < 2; k++) { ctx.beginPath(); ctx.arc(h.x * S + ex[k] * S, h.y * S + ey[k] * S, S * .08, 0, Math.PI * 2); ctx.fill(); }
    if (paused) message('Pausa');
  }
  function message(t) { ctx.fillStyle = 'rgba(11,10,10,.6)'; ctx.fillRect(0, cv.height / 2 - 34, cv.width, 68); ctx.fillStyle = '#f4efee'; ctx.font = '700 22px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, cv.width / 2, cv.height / 2); }

  document.addEventListener('keydown', function (e) {
    var d = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' }[e.key];
    if (d) { e.preventDefault(); turn(d); }
    else if (e.key === ' ' && running) { e.preventDefault(); paused = !paused; draw(); }
  });
  GP.swipe(cv, turn);
  document.querySelectorAll('.pad [data-d]').forEach(function (b) { b.addEventListener('pointerdown', function (e) { e.preventDefault(); turn(b.dataset.d); }); });
  document.querySelectorAll('[data-speed]').forEach(function (b) { b.onclick = function () { setSpeed(+b.dataset.speed); b.blur(); }; });
  document.addEventListener('visibilitychange', function () { if (document.hidden && running) { paused = true; draw(); } });
  setSpeed(speed); reset();
})();
</script>
</body>
</html>
